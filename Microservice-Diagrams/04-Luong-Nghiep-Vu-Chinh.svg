<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1360" viewBox="0 0 1500 1360"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#526174"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#526174} .label{font-size:18px;font-weight:700} .body{font-size:15px} .edge{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="40" y="52" class="title">Luồng nghiệp vụ CAB System</text><text x="40" y="84" class="sub">REST công khai qua Gateway; gRPC truy vấn; Kafka đồng bộ kết quả giữa owner.</text><rect x="100" y="125" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="155" class="label">1. Customer → Gateway → Booking</text><text x="116" y="184" class="body">POST Booking → SEARCHING</text><path d="M750,207 L750,229" class="edge"/><rect x="100" y="230" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="260" class="label">2. Booking → Location / Driver</text><text x="116" y="289" class="body">gRPC nearby, eligibility và ETA → offer</text><path d="M750,312 L750,334" class="edge"/><rect x="100" y="335" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="365" class="label">3. Driver → Gateway → Booking</text><text x="116" y="394" class="body">ACCEPTED → booking.driver-assigned → Kafka</text><path d="M750,417 L750,439" class="edge"/><rect x="100" y="440" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="470" class="label">4. Kafka → Trip / Driver / Notification</text><text x="116" y="499" class="body">Tạo Trip, driverInfo cho Customer, Driver BUSY</text><path d="M750,522 L750,544" class="edge"/><rect x="100" y="545" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="575" class="label">5. Driver → Gateway → Trip / Location</text><text x="116" y="604" class="body">DRIVER_ARRIVED → PICKED_UP → IN_PROGRESS → COMPLETED</text><path d="M750,627 L750,649" class="edge"/><rect x="100" y="650" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="680" class="label">6. Trip → Kafka → Payment</text><text x="116" y="709" class="body">trip.completed → Fare + Payment PENDING</text><path d="M750,732 L750,754" class="edge"/><rect x="100" y="755" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="785" class="label">7. Customer → Gateway → Payment → sandbox</text><text x="116" y="814" class="body">Chọn ELECTRONIC → giao dịch duy nhất</text><path d="M750,837 L750,859" class="edge"/><rect x="100" y="860" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="890" class="label">8. Sandbox → Gateway → Payment</text><text x="116" y="919" class="body">Callback ký HMAC → Payment COMPLETED</text><path d="M750,942 L750,964" class="edge"/><rect x="100" y="965" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="995" class="label">9. Payment → Kafka → Trip / Notification</text><text x="116" y="1024" class="body">Trip.paymentStatus COMPLETED + paidAt; thông báo in-app</text><path d="M750,1047 L750,1069" class="edge"/><rect x="100" y="1070" width="1300" height="82" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="116" y="1100" class="label">10. Customer → Gateway → Customer owner</text><text x="116" y="1129" class="body">Rating gắn đúng Trip đã COMPLETED</text><rect x="100" y="1210" width="1300" height="105" rx="10" fill="#FFF4E5" stroke="#B08B54"/><text x="116" y="1240" class="label">Nhánh hủy trước PICKED_UP</text><text x="116" y="1270" class="body">Customer → Gateway → Booking → Kafka → Trip CANCELED; thông báo in-app cho hai bên.</text><text x="116" y="1295" class="body">Đây là nhánh thay thế luồng hoàn thành, không thực hiện sau khi chuyến đã hoàn thành.</text></svg>
