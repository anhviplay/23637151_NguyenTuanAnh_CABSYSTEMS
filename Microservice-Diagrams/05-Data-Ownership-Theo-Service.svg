<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#526174"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#526174} .label{font-size:18px;font-weight:700} .body{font-size:15px} .edge{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="40" y="52" class="title">Quyền sở hữu dữ liệu CAB System</text><text x="40" y="84" class="sub">7 database PostgreSQL và 2 database MongoDB; không truy cập kho dữ liệu của owner khác.</text><rect x="40" y="130" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="160" class="label">identity_db</text><text x="56" y="189" class="body">identity-service</text><text x="56" y="213" class="body">PostgreSQL</text><text x="56" y="237" class="body">records / outbox / inbox</text><rect x="530" y="130" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="160" class="label">customer_db</text><text x="546" y="189" class="body">customer-service</text><text x="546" y="213" class="body">PostgreSQL</text><text x="546" y="237" class="body">records / outbox / inbox</text><rect x="1020" y="130" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="160" class="label">driver_db</text><text x="1036" y="189" class="body">driver-service</text><text x="1036" y="213" class="body">PostgreSQL</text><text x="1036" y="237" class="body">records / outbox / inbox</text><rect x="40" y="340" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="370" class="label">location_db</text><text x="56" y="399" class="body">location-service</text><text x="56" y="423" class="body">MongoDB + Redis GEO</text><text x="56" y="447" class="body">records / outbox / inbox</text><rect x="530" y="340" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="370" class="label">booking_db</text><text x="546" y="399" class="body">booking-service</text><text x="546" y="423" class="body">PostgreSQL</text><text x="546" y="447" class="body">records / outbox / inbox</text><rect x="1020" y="340" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="370" class="label">trip_db</text><text x="1036" y="399" class="body">trip-service</text><text x="1036" y="423" class="body">PostgreSQL</text><text x="1036" y="447" class="body">records / outbox / inbox</text><rect x="40" y="550" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="580" class="label">payment_db</text><text x="56" y="609" class="body">payment-service</text><text x="56" y="633" class="body">PostgreSQL</text><text x="56" y="657" class="body">records / outbox / inbox</text><rect x="530" y="550" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="580" class="label">notification_db</text><text x="546" y="609" class="body">notification-service</text><text x="546" y="633" class="body">MongoDB</text><text x="546" y="657" class="body">records / outbox / inbox</text><rect x="1020" y="550" width="450" height="165" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="580" class="label">operations_db</text><text x="1036" y="609" class="body">operations-service</text><text x="1036" y="633" class="body">PostgreSQL</text><text x="1036" y="657" class="body">records / outbox / inbox</text><rect x="40" y="790" width="1420" height="190" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="820" class="label">Quy tắc lưu trữ</text><text x="56" y="849" class="body">PostgreSQL: records(kind,id,body JSONB); MongoDB: records với kind/body và outbox/inbox.</text><text x="56" y="873" class="body">Redis Location: chỉ mục GEO; MongoDB: bản ghi current/history. Redis Gateway: bộ đếm rate limit.</text><text x="56" y="897" class="body">Mỗi DB có user riêng. Khóa lấy từ .env, không lưu trong DB hoặc Git.</text><text x="56" y="921" class="body">Payment sandbox có SQLite riêng, không truy cập database nghiệp vụ.</text></svg>
