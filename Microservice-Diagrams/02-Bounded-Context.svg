<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#526174"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#526174} .label{font-size:18px;font-weight:700} .body{font-size:15px} .edge{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="40" y="52" class="title">Bounded context CAB System</text><text x="40" y="84" class="sub">9 miền nghiệp vụ, 9 owner độc lập; Gateway không sở hữu dữ liệu nghiệp vụ.</text><rect x="40" y="130" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="160" class="label">identity-service</text><text x="56" y="189" class="body">Tài khoản, OTP đăng ký, phiên và JWT</text><text x="56" y="213" class="body">identity_db</text><text x="56" y="237" class="body">PostgreSQL</text><rect x="530" y="130" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="160" class="label">customer-service</text><text x="546" y="189" class="body">Hồ sơ Customer, Rating và điểm tổng hợp Driver</text><text x="546" y="213" class="body">customer_db</text><text x="546" y="237" class="body">PostgreSQL</text><rect x="1020" y="130" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="160" class="label">driver-service</text><text x="1036" y="189" class="body">Hồ sơ, xe, xét duyệt và availability</text><text x="1036" y="213" class="body">driver_db</text><text x="1036" y="237" class="body">PostgreSQL</text><rect x="40" y="340" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="370" class="label">location-service</text><text x="56" y="399" class="body">Vị trí, nearby và ETA</text><text x="56" y="423" class="body">location_db</text><text x="56" y="447" class="body">MongoDB + Redis GEO</text><rect x="530" y="340" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="370" class="label">booking-service</text><text x="546" y="399" class="body">Booking, tìm tài xế, Assignment và reservation</text><text x="546" y="423" class="body">booking_db</text><text x="546" y="447" class="body">PostgreSQL</text><rect x="1020" y="340" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="370" class="label">trip-service</text><text x="1036" y="399" class="body">Vòng đời Trip và ghi nhận thanh toán</text><text x="1036" y="423" class="body">trip_db</text><text x="1036" y="447" class="body">PostgreSQL</text><rect x="40" y="550" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="580" class="label">payment-service</text><text x="56" y="609" class="body">Đơn giá, Fare, Payment và callback</text><text x="56" y="633" class="body">payment_db</text><text x="56" y="657" class="body">PostgreSQL</text><rect x="530" y="550" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="580" class="label">notification-service</text><text x="546" y="609" class="body">Hộp thông báo in-app của từng actor</text><text x="546" y="633" class="body">notification_db</text><text x="546" y="657" class="body">MongoDB</text><rect x="1020" y="550" width="450" height="160" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="580" class="label">operations-service</text><text x="1036" y="609" class="body">Read model vận hành và audit sự kiện</text><text x="1036" y="633" class="body">operations_db</text><text x="1036" y="657" class="body">PostgreSQL</text><rect x="40" y="790" width="1420" height="210" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="820" class="label">Context map</text><text x="56" y="849" class="body">Booking → Driver: CheckDriverEligibility (gRPC)</text><text x="56" y="873" class="body">Booking → Location: FindNearbyDrivers / EstimateETA (gRPC)</text><text x="56" y="897" class="body">Domain owner → Kafka → consumer: sự kiện, cập nhật projection bất đồng bộ</text><text x="56" y="921" class="body">Payment → Trip: payment.status-changed; Notification: hộp in-app; Operations: audit/read model</text></svg>
