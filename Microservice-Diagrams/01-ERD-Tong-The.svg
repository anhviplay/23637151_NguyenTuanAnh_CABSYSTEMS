<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#526174"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#526174} .label{font-size:18px;font-weight:700} .body{font-size:15px} .edge{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="40" y="52" class="title">Mô hình dữ liệu logic CAB System</text><text x="40" y="84" class="sub">Entity thuộc owner; các tham chiếu ID liên kết Booking, Trip, Fare, Payment và Rating.</text><rect x="40" y="130" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="160" class="label">identity-service</text><text x="56" y="189" class="body">Account → Customer / Driver</text><text x="56" y="213" class="body">Phone HMAC, OTP, Session</text><text x="56" y="237" class="body">Credential: hash / cipher</text><rect x="530" y="130" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="160" class="label">customer-service</text><text x="546" y="189" class="body">Customer → Rating</text><text x="546" y="213" class="body">Rating.tripId → Trip</text><text x="546" y="237" class="body">Rating.driverId → Driver</text><rect x="1020" y="130" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="160" class="label">driver-service</text><text x="1036" y="189" class="body">Driver → Vehicle</text><text x="1036" y="213" class="body">verification / availability</text><text x="1036" y="237" class="body">Driver → closed_booking</text><rect x="40" y="360" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="390" class="label">location-service</text><text x="56" y="419" class="body">LocationCurrent → Driver</text><text x="56" y="443" class="body">LocationHistory → Driver</text><text x="56" y="467" class="body">Redis GEO → driverId</text><rect x="530" y="360" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="390" class="label">booking-service</text><text x="546" y="419" class="body">Booking → Assignment</text><text x="546" y="443" class="body">Reservation → Driver</text><text x="546" y="467" class="body">driverInfo, tripId</text><rect x="1020" y="360" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="390" class="label">trip-service</text><text x="1036" y="419" class="body">Trip → Booking / Driver</text><text x="1036" y="443" class="body">history / distanceKm</text><text x="1036" y="467" class="body">paymentId / paymentStatus / paidAt</text><rect x="40" y="590" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="620" class="label">payment-service</text><text x="56" y="649" class="body">Fare → Trip / ServiceRate</text><text x="56" y="673" class="body">Payment → Fare / Trip</text><text x="56" y="697" class="body">Callback → Payment</text><rect x="530" y="590" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="620" class="label">notification-service</text><text x="546" y="649" class="body">Notification → recipientId</text><text x="546" y="673" class="body">eventId / bookingId / tripId</text><text x="546" y="697" class="body">details.status / reason</text><rect x="1020" y="590" width="450" height="192" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="620" class="label">operations-service</text><text x="1036" y="649" class="body">Read models → domain IDs</text><text x="1036" y="673" class="body">Audit → event / aggregate</text><text x="1036" y="697" class="body">correlationId</text><text x="40" y="890" class="sub">→ là tham chiếu logic; không có foreign key hay JOIN xuyên database.</text><text x="40" y="922" class="sub">Mỗi owner lưu records + outbox + inbox; quan hệ trong hình mô tả dữ liệu nghiệp vụ.</text></svg>
