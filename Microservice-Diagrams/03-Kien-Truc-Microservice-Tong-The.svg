<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#526174"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .sub{font-size:16px;fill:#526174} .label{font-size:18px;font-weight:700} .body{font-size:15px} .edge{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="40" y="52" class="title">Kiến trúc triển khai CAB System</text><text x="40" y="84" class="sub">Gateway + 9 microservice + PostgreSQL + MongoDB + 2 Redis + Kafka + payment-sandbox.</text><rect x="40" y="130" width="390" height="125" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="160" class="label">Postman / API client</text><text x="56" y="189" class="body">Customer · Driver · Operations</text><text x="56" y="213" class="body">HTTPS localhost:8443</text><rect x="530" y="130" width="930" height="125" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="160" class="label">Gateway</text><text x="546" y="189" class="body">JWT · định tuyến owner · health · Redis rate limit</text><text x="546" y="213" class="body">Host port duy nhất: 127.0.0.1:8443</text><path d="M430,190 L530,190" class="edge"/><rect x="40" y="330" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="360" class="label">identity-service</text><text x="56" y="389" class="body">identity_db (PostgreSQL)</text><rect x="530" y="330" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="360" class="label">customer-service</text><text x="546" y="389" class="body">customer_db (PostgreSQL)</text><rect x="1020" y="330" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="360" class="label">driver-service</text><text x="1036" y="389" class="body">driver_db (PostgreSQL)</text><rect x="40" y="490" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="520" class="label">location-service</text><text x="56" y="549" class="body">location_db (MongoDB + Redis GEO)</text><rect x="530" y="490" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="520" class="label">booking-service</text><text x="546" y="549" class="body">booking_db (PostgreSQL)</text><rect x="1020" y="490" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="520" class="label">trip-service</text><text x="1036" y="549" class="body">trip_db (PostgreSQL)</text><rect x="40" y="650" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="680" class="label">payment-service</text><text x="56" y="709" class="body">payment_db (PostgreSQL)</text><rect x="530" y="650" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="546" y="680" class="label">notification-service</text><text x="546" y="709" class="body">notification_db (MongoDB)</text><rect x="1020" y="650" width="450" height="120" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="1036" y="680" class="label">operations-service</text><text x="1036" y="709" class="body">operations_db (PostgreSQL)</text><path d="M990,255 L990,320" class="edge"/><text x="990.0" y="279.5" text-anchor="middle" class="body">REST nội bộ</text><rect x="40" y="840" width="690" height="170" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="56" y="870" class="label">Kafka KRaft</text><text x="56" y="899" class="body">14 topic · outbox / inbox</text><text x="56" y="923" class="body">Domain event tạo Trip, Fare, Notification</text><text x="56" y="947" class="body">Sự kiện Payment ghi nhận Trip đã thanh toán</text><rect x="770" y="840" width="690" height="170" rx="10" fill="#EAF2FB" stroke="#7B94AC"/><text x="786" y="870" class="label">Payment sandbox cục bộ</text><text x="786" y="899" class="body">SQLite trên volume riêng · HTTPS</text><text x="786" y="923" class="body">Payment gọi tạo giao dịch; callback qua Gateway</text><text x="786" y="947" class="body">Thông báo người dùng: hộp in-app theo từng actor</text><text x="40" y="1060" class="sub">gRPC nội bộ: Booking → Driver / Location. Chỉ Gateway công bố host port; các kho dữ liệu ở backend nội bộ.</text></svg>
