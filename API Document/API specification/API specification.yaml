
openapi: 3.0.3
info:
  title: CAB System API
  version: 1.0.0
  description: |
    Contract API MBB được suy ra từ SRS của hệ thống CAB.
    Công thức tính cước, chính sách hủy và tiêu chí ưu tiên tài xế chưa được
    Công ty ABC xác nhận nên không được đặc tả cứng trong API.
  contact:
    name: ABC Company
servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Authentication
  - name: Customers
  - name: Drivers
  - name: Trips
  - name: Payments
  - name: Ratings
  - name: Operations
  - name: Reports

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Customers]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Customers]
      summary: Update current customer profile
      operationId: updateCurrentCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /drivers:
    post:
      tags: [Drivers]
      summary: Create a driver account
      description: Available to an operator. Driver self-registration can use the same payload.
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Operations]
      summary: List drivers
      operationId: listDrivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: availability_status
          in: query
          schema:
            $ref: '#/components/schemas/AvailabilityStatus'
        - name: account_status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Paginated drivers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drivers/me:
    patch:
      tags: [Drivers]
      summary: Update driver profile and vehicle
      operationId: updateDriverProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Driver profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /drivers/me/availability:
    patch:
      tags: [Drivers]
      summary: Update driver availability
      operationId: updateDriverAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityUpdateRequest'
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /drivers/me/location:
    post:
      tags: [Drivers]
      summary: Submit current driver location
      operationId: submitDriverLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Location recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trips:
    post:
      tags: [Trips]
      summary: Create a ride request
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip accepted and driver search started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Trips]
      summary: List current customer's trip history
      operationId: listCustomerTrips
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TripStatus'
      responses:
        '200':
          description: Paginated trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      summary: Get trip details and current status
      operationId: getTrip
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/cancel:
    post:
      tags: [Trips]
      summary: Cancel a trip while searching for a driver
      operationId: cancelTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Trip cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/assignments:
    get:
      tags: [Trips]
      summary: List driver assignment attempts
      operationId: listTripAssignments
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Assignment attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips/{tripId}/assignment-response:
    post:
      tags: [Drivers]
      summary: Accept or reject a trip assignment
      operationId: respondToTripAssignment
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentResponseRequest'
      responses:
        '200':
          description: Assignment response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Assignment expired or trip already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/status:
    patch:
      tags: [Trips]
      summary: Advance trip status
      description: Status changes must follow the sequence defined in the SRS.
      operationId: updateTripStatus
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusUpdateRequest'
      responses:
        '200':
          description: Trip status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/payment:
    post:
      tags: [Payments]
      summary: Pay for a completed trip
      description: No card number, bank credentials or other sensitive payment data is accepted or stored by CAB.
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created or electronic payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Trip is not payable or payment already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/payment/retry:
    post:
      tags: [Payments]
      summary: Retry a failed electronic payment
      operationId: retryPayment
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Payment retry initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Payment is not eligible for retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/rating:
    post:
      tags: [Ratings]
      summary: Rate the driver after trip completion
      operationId: createRating
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Trip is not completed or already rated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payments:
    get:
      tags: [Operations]
      summary: Search payment transactions
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: payment_method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Paginated payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/trips/active:
    get:
      tags: [Operations]
      summary: List active trips
      operationId: listActiveTrips
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Active trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/trips/{tripId}/support:
    post:
      tags: [Operations]
      summary: Record an operational support action
      operationId: supportTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportActionRequest'
      responses:
        '200':
          description: Support action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/operations:
    get:
      tags: [Reports]
      summary: Get operational activity report
      operationId: getOperationsReport
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Operational report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [full_name, phone, email, password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    User:
      oneOf:
        - $ref: '#/components/schemas/Customer'
        - $ref: '#/components/schemas/Driver'
        - $ref: '#/components/schemas/Operator'
      discriminator:
        propertyName: user_type

    Customer:
      type: object
      required: [customer_id, user_type, full_name, phone, email, account_status, created_at]
      properties:
        customer_id:
          type: integer
          format: int64
        user_type:
          type: string
          enum: [CUSTOMER]
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        created_at:
          type: string
          format: date-time

    CustomerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email

    Driver:
      type: object
      required: [driver_id, user_type, full_name, phone, account_status, availability_status, created_at]
      properties:
        driver_id:
          type: integer
          format: int64
        user_type:
          type: string
          enum: [DRIVER]
        full_name:
          type: string
        phone:
          type: string
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        availability_status:
          $ref: '#/components/schemas/AvailabilityStatus'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        latest_location:
          $ref: '#/components/schemas/DriverLocation'
        created_at:
          type: string
          format: date-time

    CreateDriverRequest:
      type: object
      required: [full_name, phone, password, vehicle]
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        vehicle:
          $ref: '#/components/schemas/VehicleInput'

    DriverUpdateRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        vehicle:
          $ref: '#/components/schemas/VehicleInput'

    Vehicle:
      type: object
      required: [vehicle_id, driver_id, vehicle_type, license_plate, vehicle_status]
      properties:
        vehicle_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
        vehicle_status:
          $ref: '#/components/schemas/VehicleStatus'

    VehicleInput:
      type: object
      required: [vehicle_type, license_plate]
      properties:
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          maxLength: 30
        vehicle_status:
          $ref: '#/components/schemas/VehicleStatus'

    AvailabilityUpdateRequest:
      type: object
      required: [account_status, availability_status]
      properties:
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        availability_status:
          $ref: '#/components/schemas/AvailabilityStatus'

    CreateTripRequest:
      type: object
      required: [pickup_address, pickup_latitude, pickup_longitude, destination_address, destination_latitude, destination_longitude, requested_vehicle_type]
      properties:
        pickup_address:
          type: string
        pickup_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        pickup_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        destination_address:
          type: string
        destination_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        destination_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        requested_vehicle_type:
          $ref: '#/components/schemas/VehicleType'

    Trip:
      type: object
      required: [trip_id, customer_id, pickup_address, destination_address, requested_vehicle_type, trip_status, requested_at]
      properties:
        trip_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
          nullable: true
        vehicle:
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          nullable: true
        pickup_address:
          type: string
        pickup_latitude:
          type: number
          format: double
        pickup_longitude:
          type: number
          format: double
        destination_address:
          type: string
        destination_latitude:
          type: number
          format: double
        destination_longitude:
          type: number
          format: double
        requested_vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        trip_status:
          $ref: '#/components/schemas/TripStatus'
        fare_amount:
          type: number
          format: double
          nullable: true
        estimated_driver_arrival_minutes:
          type: integer
          minimum: 0
          nullable: true
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        payment:
          $ref: '#/components/schemas/Payment'

    TripStatusUpdateRequest:
      type: object
      required: [trip_status]
      properties:
        trip_status:
          type: string
          enum: [DRIVER_ARRIVED, PASSENGER_PICKED_UP, IN_PROGRESS, COMPLETED]

    AssignmentResponseRequest:
      type: object
      required: [response_status]
      properties:
        response_status:
          type: string
          enum: [ACCEPTED, REJECTED]

    DriverAssignment:
      type: object
      required: [assignment_id, trip_id, driver_id, sent_at, response_status, is_selected]
      properties:
        assignment_id:
          type: integer
          format: int64
        trip_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        sent_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        response_status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, NO_RESPONSE, EXPIRED]
        is_selected:
          type: boolean

    LocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    DriverLocation:
      allOf:
        - $ref: '#/components/schemas/LocationRequest'
        - type: object
          required: [location_id, driver_id, recorded_at]
          properties:
            location_id:
              type: integer
              format: int64
            driver_id:
              type: integer
              format: int64
            recorded_at:
              type: string
              format: date-time

    CreatePaymentRequest:
      type: object
      required: [payment_method]
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        return_url:
          type: string
          format: uri
          description: Required by some external payment providers; CAB stores only the provider reference.

    Payment:
      type: object
      required: [payment_id, trip_id, payment_method, amount, payment_status, retry_count]
      properties:
        payment_id:
          type: integer
          format: int64
        trip_id:
          type: integer
          format: int64
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: number
          format: double
          minimum: 0
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        provider_reference:
          type: string
          nullable: true
        retry_count:
          type: integer
          minimum: 0
        paid_at:
          type: string
          format: date-time
          nullable: true

    CreateRatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    Rating:
      type: object
      required: [rating_id, trip_id, customer_id, driver_id, score, created_at]
      properties:
        rating_id:
          type: integer
          format: int64
        trip_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    SupportActionRequest:
      type: object
      required: [action_detail]
      properties:
        action_detail:
          type: string
          minLength: 1
          maxLength: 2000

    Operator:
      type: object
      required: [operator_id, user_type, full_name, username, role, account_status, created_at]
      properties:
        operator_id:
          type: integer
          format: int64
        user_type:
          type: string
          enum: [OPERATOR]
        full_name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [OPERATOR, ADMIN, LEADERSHIP]
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        created_at:
          type: string
          format: date-time

    OperationsReport:
      type: object
      required: [from, to, trip_count, revenue, completion_rate, cancellation_rate, driver_performance]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        trip_count:
          type: integer
          minimum: 0
        revenue:
          type: number
          format: double
          minimum: 0
        completion_rate:
          type: number
          format: double
          minimum: 0
          maximum: 100
        cancellation_rate:
          type: number
          format: double
          minimum: 0
          maximum: 100
        driver_performance:
          type: array
          items:
            type: object
            required: [driver_id, completed_trips, average_rating]
            properties:
              driver_id:
                type: integer
                format: int64
              completed_trips:
                type: integer
                minimum: 0
              average_rating:
                type: number
                format: double
                minimum: 0
                maximum: 5

    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
    AvailabilityStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    VehicleType:
      type: string
      description: Loại xe do nghiệp vụ CAB cấu hình; SRS chưa chốt danh sách giá trị.
    VehicleStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    TripStatus:
      type: string
      enum: [ACCEPTED, SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVED, PASSENGER_PICKED_UP, IN_PROGRESS, COMPLETED, CANCELLED, NO_DRIVER_FOUND, SUPPORT_REQUIRED]
    PaymentMethod:
      type: string
      enum: [CASH, ELECTRONIC]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    TripPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    DriverPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaymentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

security:
  - bearerAuth: []
