      timeout: 5s
      retries: 18
      start_period: 30s

  gateway:
    image: cab-system-backend:local
    build: .
    environment:
      SERVICE_NAME: gateway
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS}
      NODE_EXTRA_CA_CERTS: /tls/cert.pem
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./.data/tls:/tls:ro
    networks: [frontend, backend]
    depends_on:
      redis-gateway:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      operations-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://localhost:8443/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sandbox-payment-data:
  postgres-data:
  mongo-data:
  mongo-keyfile:
  redis-gateway-data:
  redis-location-data:
  kafka-data:

networks:
  frontend:
  backend:
    internal: true
