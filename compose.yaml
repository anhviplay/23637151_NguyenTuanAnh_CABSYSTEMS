      REDIS_HOST: "redis-location"
      REDIS_PASSWORD: "${LOCATION_REDIS_PASSWORD}"
    volumes:
      - ./.data/tls/cert.pem:/tls/cert.pem:ro
    networks: [backend]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      redis-location:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  booking-service:
